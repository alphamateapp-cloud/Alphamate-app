name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24.12
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Web Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_RAILWAY_API_URL: ${{ secrets.VITE_RAILWAY_API_URL || vars.VITE_RAILWAY_API_URL || secrets.RAILWAY_API_URL || vars.RAILWAY_API_URL || 'https://api.alphamate.app' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_FIRESTORE_DATABASE_ID || vars.VITE_FIREBASE_FIRESTORE_DATABASE_ID }}
          VITE_CLOUDFLARE_WORKER_URL: ${{ secrets.VITE_CLOUDFLARE_WORKER_URL || vars.VITE_CLOUDFLARE_WORKER_URL }}
          VITE_R2_MEDIA_DOMAIN: ${{ secrets.VITE_R2_MEDIA_DOMAIN || vars.VITE_R2_MEDIA_DOMAIN }}
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Verify Java Environment
        run: |
          java -version
          javac -version
          echo "JAVA_HOME is $JAVA_HOME"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Decode Android Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE || secrets.KEYSTORE_FILE || secrets.SIGNING_KEY || secrets.SIGNING_KEY_BASE64 || secrets.ANDROID_SIGNING_KEY || secrets.ANDROID_SIGNING_KEY_BASE64 || secrets.SIGNING_KEYSTORE || secrets.SIGNING_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_B64 || secrets.KEYSTORE_B64 || secrets.RELEASE_SIGNING_KEY || secrets.RELEASE_KEY_BASE64 || secrets.PLAYSTORE_KEYSTORE_BASE64 || secrets.PLAYSTORE_KEYSTORE || secrets.UPLOAD_KEYSTORE_BASE64 || secrets.UPLOAD_KEYSTORE || secrets.JKS_BASE64 || secrets.ANDROID_JKS_BASE64 || secrets.KEYSTORE || vars.ANDROID_KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 || vars.SIGNING_KEY }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.KEYSTORE_PASS || secrets.ANDROID_KEYSTORE_PASS || secrets.RELEASE_KEYSTORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.JKS_PASSWORD || secrets.KS_PASSWORD || secrets.STORE_PASS || secrets.PLAYSTORE_KEYSTORE_PASSWORD || secrets.SIGNING_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.KEY_PASS || vars.ANDROID_KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.KEYSTORE_ALIAS || secrets.ALIAS || secrets.SIGNING_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || secrets.ANDROID_ALIAS || vars.ANDROID_KEY_ALIAS || vars.KEY_ALIAS || vars.ALIAS }}
          K_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.KEY_PASS || secrets.SIGNING_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || secrets.KEY_STORE_PASSWORD || vars.ANDROID_KEY_PASSWORD || vars.KEY_PASSWORD }}
        run: |
          HAS_B64=$([ -n "$KEYSTORE_B64" ] && echo "true" || echo "false")
          HAS_PW=$([ -n "$KS_PASSWORD" ] && echo "true" || echo "false")
          HAS_ALIAS=$([ -n "$K_ALIAS" ] && echo "true" || echo "false")
          HAS_KPW=$([ -n "$K_PASSWORD" ] && echo "true" || echo "false")
          echo "Signing secret check -> event=${GITHUB_EVENT_NAME}, keystore_b64=${HAS_B64}, store_password=${HAS_PW}, key_alias=${HAS_ALIAS}, key_password=${HAS_KPW}"

          if [ -n "$KEYSTORE_B64" ] && [ -n "$KS_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]"' | tr '_-' '/+' | base64 --decode > android/app/release-key.jks
            if [ ! -s android/app/release-key.jks ]; then
              echo "::error::Decoded android/app/release-key.jks is empty. Verify your base64 keystore secret."
              exit 1
            fi
          elif [ -f android/release-key.jks ] && [ -n "$KS_PASSWORD" ]; then
            cp android/release-key.jks android/app/release-key.jks
          elif [ -f android/app/release-key.jks ] && [ -n "$KS_PASSWORD" ]; then
            echo "Using existing android/app/release-key.jks."
          else
            if [ "$HAS_B64" = "false" ] && [ "$HAS_PW" = "false" ]; then
              echo "::error::Both keystore base64 secret and keystore password secret are unavailable (keystore_b64=false, store_password=false, event=${GITHUB_EVENT_NAME}). Ensure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (or SIGNING_KEY / KEY_STORE_PASSWORD) are set in GitHub Repository Secrets (not Environment-only secrets or a fork PR)."
            elif [ "$HAS_B64" = "false" ]; then
              echo "::error::Keystore base64 secret is missing (keystore_b64=false, store_password=true). Add ANDROID_KEYSTORE_BASE64 (or SIGNING_KEY / KEYSTORE_BASE64) to GitHub Repository Secrets."
            else
              echo "::error::Keystore password secret is missing (keystore_b64=true, store_password=false). Add ANDROID_KEYSTORE_PASSWORD (or KEYSTORE_PASSWORD / KEY_STORE_PASSWORD) to GitHub Repository Secrets."
            fi
            exit 1
          fi

          DETECTED_ALIAS=$(keytool -list -keystore android/app/release-key.jks -storepass "$KS_PASSWORD" 2>/dev/null | grep 'PrivateKeyEntry' | head -n1 | cut -d',' -f1 | xargs || true)
          if [ -n "$K_ALIAS" ] && keytool -list -keystore android/app/release-key.jks -storepass "$KS_PASSWORD" -alias "$K_ALIAS" >/dev/null 2>&1; then
            RESOLVED_ALIAS="$K_ALIAS"
          elif [ -n "$DETECTED_ALIAS" ]; then
            RESOLVED_ALIAS="$DETECTED_ALIAS"
          else
            RESOLVED_ALIAS="${K_ALIAS:-alphamate}"
          fi
          RESOLVED_KEY_PW="${K_PASSWORD:-$KS_PASSWORD}"

          if ! keytool -list -keystore android/app/release-key.jks -storepass "$KS_PASSWORD" -alias "$RESOLVED_ALIAS" >/dev/null; then
            echo "::error::Failed to open keystore android/app/release-key.jks with alias '$RESOLVED_ALIAS'. Verify keystore password and alias."
            exit 1
          fi

          echo "::add-mask::$KS_PASSWORD"
          echo "::add-mask::$RESOLVED_KEY_PW"
          {
            echo "ANDROID_KEYSTORE_PATH=release-key.jks"
            echo "ANDROID_KEYSTORE_PASSWORD<<__AM_KS_EOF__"
            printf '%s\n' "$KS_PASSWORD"
            echo "__AM_KS_EOF__"
            echo "ANDROID_KEY_ALIAS=$RESOLVED_ALIAS"
            echo "ANDROID_KEY_PASSWORD<<__AM_KEY_EOF__"
            printf '%s\n' "$RESOLVED_KEY_PW"
            echo "__AM_KEY_EOF__"
            echo "SIGNED_RELEASE=true"
          } >> "$GITHUB_ENV"
          echo "Release signing configured cleanly with alias '$RESOLVED_ALIAS'."

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew --stop || true
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Build Release APK
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Build Android App Bundle (AAB)
        run: |
          cd android
          ./gradlew --no-daemon bundleRelease --stacktrace

      - name: Verify Generated & Signed Binaries
        run: |
          echo "=== Android Build Outputs Inspection ==="
          ls -la android/app/build/outputs/apk/debug/ || true
          ls -la android/app/build/outputs/apk/release/ || true
          ls -la android/app/build/outputs/bundle/release/ || true
          if [ "${SIGNED_RELEASE}" = "true" ]; then
            if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
              echo "::error::Unsigned release APK was generated instead of a signed release APK."
              exit 1
            fi
            if [ ! -f android/app/build/outputs/apk/release/app-release.apk ]; then
              echo "::error::Expected signed android/app/build/outputs/apk/release/app-release.apk was not generated."
              exit 1
            fi
            if [ ! -f android/app/build/outputs/bundle/release/app-release.aab ]; then
              echo "::error::Expected signed android/app/build/outputs/bundle/release/app-release.aab was not generated."
              exit 1
            fi
            APKSIGNER_BIN=$(ls -d ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -z "$APKSIGNER_BIN" ]; then
              echo "::error::apksigner was not found; cannot verify release APK signature."
              exit 1
            fi
            "$APKSIGNER_BIN" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
            AAB_VERIFY=$(jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab 2>&1)
            echo "$AAB_VERIFY"
            if ! echo "$AAB_VERIFY" | grep -q "jar verified."; then
              echo "::error::app-release.aab signature verification failed (jar is not verified)."
              exit 1
            fi
          fi

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f android/app/release-key.jks

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alphamate-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alphamate-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alphamate-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
