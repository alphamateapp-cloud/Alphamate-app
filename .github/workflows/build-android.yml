name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24.12
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Web Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_RAILWAY_API_URL: ${{ secrets.VITE_RAILWAY_API_URL || vars.VITE_RAILWAY_API_URL || secrets.RAILWAY_API_URL || vars.RAILWAY_API_URL || 'https://api.alphamate.app' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_FIRESTORE_DATABASE_ID || vars.VITE_FIREBASE_FIRESTORE_DATABASE_ID }}
          VITE_CLOUDFLARE_WORKER_URL: ${{ secrets.VITE_CLOUDFLARE_WORKER_URL || vars.VITE_CLOUDFLARE_WORKER_URL }}
          VITE_R2_MEDIA_DOMAIN: ${{ secrets.VITE_R2_MEDIA_DOMAIN || vars.VITE_R2_MEDIA_DOMAIN }}
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Verify Java Environment
        run: |
          java -version
          javac -version
          echo "JAVA_HOME is $JAVA_HOME"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew --stop || true
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Prepare Android Signing Keystore
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");

            let secrets = {};
            let vars = {};
            try { secrets = JSON.parse(process.env.SECRETS_JSON || "{}"); } catch {}
            try { vars = JSON.parse(process.env.VARS_JSON || "{}"); } catch {}

            const pool = [];
            for (const [k, v] of Object.entries(secrets)) {
              if (k.toLowerCase() === "github_token") continue;
              if (typeof v === "string" && v.length > 0) pool.push({ source: "secret", key: k, val: v });
            }
            for (const [k, v] of Object.entries(vars)) {
              if (typeof v === "string" && v.length > 0) pool.push({ source: "var", key: k, val: v });
            }

            const visibleSecretNames = pool.filter(p => p.source === "secret").map(p => p.key);
            const visibleVarNames = pool.filter(p => p.source === "var").map(p => p.key);
            console.log("Available repository secret names:", visibleSecretNames.length ? visibleSecretNames.join(", ") : "(none)");
            console.log("Available repository variable names:", visibleVarNames.length ? visibleVarNames.join(", ") : "(none)");

            const pickExact = (names) => {
              for (const name of names) {
                const hit = pool.find(p => p.key === name || p.key.toUpperCase() === name);
                if (hit) return hit;
              }
              return null;
            };

            const pickPattern = (regex, excludeRegex) => {
              return pool.find(p => regex.test(p.key) && (!excludeRegex || !excludeRegex.test(p.key))) || null;
            };

            const b64Match = pickExact([
              "ANDROID_KEYSTORE_BASE64", "KEYSTORE_BASE64", "RELEASE_KEYSTORE_BASE64",
              "ANDROID_KEYSTORE", "KEYSTORE_FILE", "SIGNING_KEY", "SIGNING_KEY_BASE64",
              "ANDROID_SIGNING_KEY", "ANDROID_SIGNING_KEY_BASE64", "SIGNING_KEYSTORE",
              "SIGNING_KEYSTORE_BASE64", "ANDROID_KEYSTORE_B64", "KEYSTORE_B64",
              "RELEASE_SIGNING_KEY", "RELEASE_KEY_BASE64", "PLAYSTORE_KEYSTORE_BASE64",
              "PLAYSTORE_KEYSTORE", "UPLOAD_KEYSTORE_BASE64", "UPLOAD_KEYSTORE",
              "JKS_BASE64", "ANDROID_JKS_BASE64", "KEYSTORE"
            ]) || pickPattern(/(keystore|jks|upload_key|playstore_key|signing_key)/i, /(pass|pwd|alias|email|token|url|api_key)/i);

            const ksPwMatch = pickExact([
              "ANDROID_KEYSTORE_PASSWORD", "KEYSTORE_PASSWORD", "STORE_PASSWORD",
              "KEY_STORE_PASSWORD", "KEYSTORE_PASS", "ANDROID_KEYSTORE_PASS",
              "RELEASE_KEYSTORE_PASSWORD", "RELEASE_STORE_PASSWORD", "SIGNING_STORE_PASSWORD",
              "SIGNING_KEYSTORE_PASSWORD", "ANDROID_STORE_PASSWORD", "JKS_PASSWORD",
              "KS_PASSWORD", "STORE_PASS", "PLAYSTORE_KEYSTORE_PASSWORD",
              "SIGNING_KEY_PASSWORD", "ANDROID_KEY_PASSWORD", "KEY_PASSWORD", "KEY_PASS"
            ]) || pickPattern(/(store|keystore|jks|signing).*?(pass|pwd|pw)/i, /(b64|base64|alias)/i);

            const aliasMatch = pickExact([
              "ANDROID_KEY_ALIAS", "KEY_ALIAS", "KEYSTORE_ALIAS", "ALIAS",
              "SIGNING_KEY_ALIAS", "RELEASE_KEY_ALIAS", "ANDROID_ALIAS"
            ]) || pickPattern(/alias/i, /(pass|pwd|b64|base64)/i);

            const keyPwMatch = pickExact([
              "ANDROID_KEY_PASSWORD", "KEY_PASSWORD", "KEY_PASS",
              "SIGNING_KEY_PASSWORD", "RELEASE_KEY_PASSWORD",
              "ANDROID_KEYSTORE_PASSWORD", "KEYSTORE_PASSWORD", "STORE_PASSWORD", "KEY_STORE_PASSWORD"
            ]) || pickPattern(/(key|signing).*?(pass|pwd|pw)/i, /(b64|base64|alias|api_key)/i) || ksPwMatch;

            console.log(
              "Signing secret resolution -> event=" + (process.env.GITHUB_EVENT_NAME || "unknown") +
              ", keystore_b64=" + (b64Match ? b64Match.key : "missing") +
              ", store_password=" + (ksPwMatch ? ksPwMatch.key : "missing") +
              ", key_alias=" + (aliasMatch ? aliasMatch.key : "auto") +
              ", key_password=" + (keyPwMatch ? keyPwMatch.key : "missing")
            );

            const envFile = process.env.GITHUB_ENV;
            const summaryFile = process.env.GITHUB_STEP_SUMMARY;
            const writeEnv = (lines) => fs.appendFileSync(envFile, lines.join("\n") + "\n");

            const hasOfficialSecrets = Boolean(b64Match && ksPwMatch) ||
              (fs.existsSync("android/release-key.jks") && Boolean(ksPwMatch)) ||
              (fs.existsSync("android/app/release-key.jks") && Boolean(ksPwMatch));

            if (hasOfficialSecrets) {
              if (b64Match && ksPwMatch) {
                const cleaned = b64Match.val.replace(/[\s"\x27]/g, "").replace(/-/g, "+").replace(/_/g, "/");
                const buf = Buffer.from(cleaned, "base64");
                if (!buf.length) {
                  console.error("::error::Decoded android/app/release-key.jks is empty. Verify your base64 keystore secret (" + b64Match.key + ").");
                  process.exit(1);
                }
                fs.writeFileSync("android/app/release-key.jks", buf);
              } else if (fs.existsSync("android/release-key.jks")) {
                fs.copyFileSync("android/release-key.jks", "android/app/release-key.jks");
              }

              const ksPassword = ksPwMatch.val;
              const kAlias = aliasMatch ? aliasMatch.val.trim() : "";
              const keyPassword = (keyPwMatch ? keyPwMatch.val : "") || ksPassword;

              console.log("::add-mask::" + ksPassword);
              console.log("::add-mask::" + keyPassword);

              let detectedAlias = "";
              try {
                const listOut = execFileSync("keytool", ["-list", "-keystore", "android/app/release-key.jks", "-storepass", ksPassword], { encoding: "utf8" });
                const line = listOut.split(/\r?\n/).find(l => l.includes("PrivateKeyEntry"));
                if (line) detectedAlias = line.split(",")[0].trim();
              } catch {}

              let resolvedAlias = detectedAlias || kAlias || "alphamate";
              if (kAlias) {
                try {
                  execFileSync("keytool", ["-list", "-keystore", "android/app/release-key.jks", "-storepass", ksPassword, "-alias", kAlias], { stdio: "ignore" });
                  resolvedAlias = kAlias;
                } catch {}
              }

              try {
                execFileSync("keytool", ["-list", "-keystore", "android/app/release-key.jks", "-storepass", ksPassword, "-alias", resolvedAlias], { stdio: "inherit" });
              } catch {
                console.error("::error::Failed to open android/app/release-key.jks with alias " + resolvedAlias + ". Check keystore password and alias.");
                process.exit(1);
              }

              const ksMarker = "__AM_KS_" + Math.random().toString(36).slice(2) + "__";
              const kpMarker = "__AM_KP_" + Math.random().toString(36).slice(2) + "__";
              writeEnv([
                "ANDROID_KEYSTORE_PATH=release-key.jks",
                "ANDROID_KEYSTORE_PASSWORD<<" + ksMarker,
                ksPassword,
                ksMarker,
                "ANDROID_KEY_ALIAS=" + resolvedAlias,
                "ANDROID_KEY_PASSWORD<<" + kpMarker,
                keyPassword,
                kpMarker,
                "SIGNED_RELEASE=true",
                "PREVIEW_SIGNED=false"
              ]);
              console.log("Official Play Store release signing configured cleanly with alias: " + resolvedAlias);
            } else {
              console.error("::error::Official Android release signing is not configured. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD to GitHub Actions Repository Secrets. Optional: ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (key password defaults to store password). A temporary preview key is not accepted for Play Store release artifacts.");
              process.exit(1);
            }
          '

      - name: Build Release APK
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Build Android App Bundle (AAB)
        run: |
          if [ "${SIGNED_RELEASE}" != "true" ]; then
            echo "::error::AAB build blocked because official release signing was not verified."
            exit 1
          fi
          cd android
          ./gradlew --no-daemon bundleRelease --stacktrace

      - name: Verify Generated & Signed Binaries
        run: |
          echo "=== Android Build Outputs Inspection ==="
          ls -la android/app/build/outputs/apk/debug/ || true
          ls -la android/app/build/outputs/apk/release/ || true
          ls -la android/app/build/outputs/bundle/release/ || true
          if [ "${SIGNED_RELEASE}" = "true" ] || [ "${PREVIEW_SIGNED}" = "true" ]; then
            if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
              echo "::error::Unsigned release APK was generated instead of a signed release APK."
              exit 1
            fi
            if [ ! -f android/app/build/outputs/apk/release/app-release.apk ]; then
              echo "::error::Expected signed android/app/build/outputs/apk/release/app-release.apk was not generated."
              exit 1
            fi
            APKSIGNER_BIN=$(ls -d ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -z "$APKSIGNER_BIN" ]; then
              echo "::error::apksigner was not found; cannot verify release APK signature."
              exit 1
            fi
            "$APKSIGNER_BIN" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          fi
          if [ "${SIGNED_RELEASE}" = "true" ]; then
            if [ ! -f android/app/build/outputs/bundle/release/app-release.aab ]; then
              echo "::error::Expected signed android/app/build/outputs/bundle/release/app-release.aab was not generated."
              exit 1
            fi
            AAB_VERIFY=$(jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab 2>&1)
            echo "$AAB_VERIFY"
            if ! echo "$AAB_VERIFY" | grep -q "jar verified."; then
              echo "::error::app-release.aab signature verification failed (jar is not verified)."
              exit 1
            fi
          fi

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f android/app/release-key.jks

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alphamate-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alphamate-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alphamate-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
