name: Sync lockfiles and verify build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Sync Bun lockfile
        run: bun install --lockfile-only

      - name: Sync npm lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify clean Bun install
        run: bun install --frozen-lockfile

      - name: Verify production build
        run: bun run build

      - name: Commit repaired lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package-lock.json
          git diff --cached --quiet || git commit -m "fix: sync bun.lock and package-lock.json"
          git push
