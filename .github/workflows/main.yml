name: Sync npm lockfile and verify build (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Remove legacy Bun lockfiles if present
        run: rm -f bun.lock bun.lockb

      - name: Sync npm lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify clean npm ci install
        run: npm ci --legacy-peer-deps

      - name: Verify production build
        run: npm run build

      - name: Commit repaired npm lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm -f --ignore-unmatch bun.lock bun.lockb
          git diff --cached --quiet || git commit -m "fix: sync package-lock.json"
          git push
