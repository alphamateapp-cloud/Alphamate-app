name: Repair npm lockfile and verify build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm

      - name: Set npm version
        run: npm install --global npm@10.9.2

      - name: Regenerate root lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Clean install from regenerated lockfile
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify production build
        run: npm run build

      - name: Commit repaired lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Fix root npm lockfile for deployment"
            git push
          else
            echo "Root package-lock.json is already synchronized."
          fi
