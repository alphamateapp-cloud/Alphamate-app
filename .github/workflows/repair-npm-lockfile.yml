name: Sync npm lockfile and verify build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Remove legacy Bun lockfiles if present
        run: rm -f bun.lock bun.lockb

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify clean npm ci install
        run: npm ci --legacy-peer-deps

      - name: Verify production build
        run: npm run build

      - name: Commit repaired npm lockfile
        run: |
          if ! git diff --quiet -- package-lock.json || git ls-files --deleted | grep -qE '^bun\.lockb?$'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A package-lock.json
            git rm -f --ignore-unmatch bun.lock bun.lockb
            git commit -m "fix: sync package-lock.json for deployment"
            git push
          else
            echo "package-lock.json is already synchronized."
          fi
