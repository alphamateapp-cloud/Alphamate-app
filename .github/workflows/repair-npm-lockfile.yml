name: Sync Bun & npm lockfiles and verify build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "bun.lock"
      - "package-lock.json"
      - ".github/workflows/repair-npm-lockfile.yml"

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Regenerate Bun lockfile
        run: bun install --lockfile-only

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify clean frozen Bun install
        run: bun install --frozen-lockfile

      - name: Verify production build
        run: bun run build

      - name: Commit repaired lockfiles
        run: |
          if ! git diff --quiet -- bun.lock package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock package-lock.json
            git commit -m "fix: sync bun.lock and package-lock.json for deployment"
            git push
          else
            echo "Lockfiles are already synchronized."
          fi
