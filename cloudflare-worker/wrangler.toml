name = "alpha-mate-reels-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Bind the R2 bucket for Reels
[[r2_buckets]]
binding = "REELS_BUCKET"
bucket_name = "alpha-mate-reels"

# Environment Variables & Secrets:
# 1. Firebase Token Verification Secret:
# wrangler secret put FIREBASE_API_KEY
# 2. Ephemeral Cloudflare Calls TURN Key Secrets (Optional):
# wrangler secret put CLOUDFLARE_TURN_KEY_ID
# wrangler secret put CLOUDFLARE_TURN_API_TOKEN
# 3. Static Cloudflare TURN Secrets (Optional):
# wrangler secret put CLOUDFLARE_TURN_USERNAME
# wrangler secret put CLOUDFLARE_TURN_CREDENTIAL
