name = "alpha-mate-reels-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Bind the R2 bucket for Reels
[[r2_buckets]]
binding = "REELS_BUCKET"
bucket_name = "alpha-mate-reels"

# Set the Railway backend base URL below. R2 remains a Cloudflare binding.

[vars]
RAILWAY_API_URL = "https://api.alphamate.app"
